services:
  - type: web
    name: spicevilla
    runtime: python
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python backend/server.py
    healthCheckPath: /api/health
    disk:
      name: spicevilla-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SPICEVILLA_HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "1"
      - key: SPICEVILLA_DB_PATH
        value: /var/data/spicevilla.sqlite3
